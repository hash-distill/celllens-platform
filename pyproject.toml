[project]
name = "celllens-platform"
version = "0.1.0"
description = "CellLens: traceable virtual-cell perturbation and metabolic analysis service"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pymysql>=1.1,<2",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0.43,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
analysis = [
  "anndata>=0.11.4,<0.13",
  "sccellfie==0.6.2",
  "h5py>=3.13,<4",
  "fsspec>=2025.3,<2027",
  "huggingface-hub>=0.34,<2",
  "scikit-learn>=1.6,<2",
  "umap-learn>=0.5.8,<0.6",
]
model = [
  "anndata>=0.11.4,<0.13",
  "arc-state==0.11.1",
  "scanpy>=1.11.2,<2",
  "sccellfie==0.6.2",
  "torch==2.14.0",
  "transformers>=4.52.3,<5",
]
report = ["jinja2>=3.1,<4", "pyarrow>=20,<24", "matplotlib>=3.10,<4", "scikit-learn>=1.6,<2", "umap-learn>=0.5.8,<0.6", "reportlab>=4.4,<5", "pypdf>=5,<8"]

[dependency-groups]
dev = [
  "basedpyright>=1.31,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.basedpyright]
include = ["backend/app", "scripts"]
exclude = ["backend/tests"]
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
