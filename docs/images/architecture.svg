<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
<title id="title">CellLens 系统架构</title>
<desc id="desc">Vue 前端通过 HTTP API 访问 FastAPI 后端。API 将任务保存到 SQLite 或 MySQL；独立 CPU 和 GPU worker 轮询数据库领取任务并更新状态。实测分析与 STATE 预测生成表达及功能分析产物，校验后写入文件存储。API 读取已完成结果并提供图表、报告和来源记录。</desc>
