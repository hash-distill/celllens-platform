services:
  mysql:
    image: mysql:8.4
    container_name: celllens-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: celllens
      MYSQL_USER: celllens
      MYSQL_PASSWORD: celllens_dev
      MYSQL_ROOT_PASSWORD: celllens_root_dev
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucelllens", "-pcelllens_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - celllens_mysql_data:/var/lib/mysql

volumes:
  celllens_mysql_data:
